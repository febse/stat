project:
  type: book
  output-dir: _site

book:
  title: "Introduction to Statistic"
  author: "Boyko Amarov"
  date: last-modified

  chapters:
    - index.qmd
    - 01-Probability.ipynb
    - 02-Counting-Things.ipynb
    - 03-Conditional-Probability.ipynb
    - 03-A-Conditional-Probability-Fallacies.ipynb
    - 04-Discrete-Random-Variables.ipynb
    - 04-A-Convolution.ipynb
    - 12-Estimation.ipynb
    - 99-Videos.ipynb
    - references.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    css: video.css
    filters:
      - at: pre-ast
        path: video.lua
    html-math-method: katex
    code-fold: true
    code-summary: "Show code"

editor: visual

profile:
  default: development

execute:
  enabled: true
